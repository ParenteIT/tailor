# Keep-alive do Supabase do plano free.
#
# Projeto free pausa após 7 dias de baixa atividade de banco (docs oficiais:
# "algumas requisições ao banco por dia já bastam"). Este workflow bate no
# endpoint de produção que faz um SELECT real em `leads`
# (GET /api/confirmation/<token> -> store.buscarLeadPorConfirmationToken), o que
# conta como atividade e zera o timer de inatividade.
#
# Se mesmo assim o projeto for encontrado pausado, o job chama a Management API
# do Supabase para religar (POST /v1/projects/{ref}/restore). Isso exige o
# secret SUPABASE_ACCESS_TOKEN (Personal Access Token de
# https://supabase.com/dashboard/account/tokens). Sem o secret, o job ainda faz
# o ping preventivo e só falha, sem tentar religar.

name: supabase-keepalive

on:
  schedule:
    # Seg / Qua / Sex às 11:00 UTC (08:00 America/Sao_Paulo). Folga enorme
    # contra a janela de 7 dias, mesmo se 1-2 execuções atrasarem ou falharem.
    - cron: "0 11 * * 1,3,5"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

env:
  ENDPOINT: "https://sobmedida.renilzamiranda.com/api/confirmation"
  PROJECT_REF: "ffyzmplwuvxdzikxpsje"

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Ping no endpoint de produção (gera atividade no banco)
        id: ping
        run: |
          set -uo pipefail
          checar() {
            local tok
            tok="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
            curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 \
              "$ENDPOINT/$tok" 2>/dev/null || echo "000"
          }
          code=""
          for tentativa in 1 2 3; do
            code="$(checar)"
            echo "tentativa $tentativa -> HTTP $code"
            head -c 200 /tmp/body 2>/dev/null; echo
            # 404 = banco respondeu (token inexistente). 200 = saudável também.
            if [ "$code" = "404" ] || [ "$code" = "200" ]; then
              echo "healthy=true" >> "$GITHUB_OUTPUT"
              echo "code=$code" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 10
          done
          echo "healthy=false" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Religar o projeto se estiver pausado
        if: steps.ping.outputs.healthy == 'false'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          code="${{ steps.ping.outputs.code }}"
          echo "::warning::Endpoint retornou HTTP $code apos 3 tentativas."

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN nao configurado — nao da pra religar automaticamente. Religue no dashboard do Supabase (projeto tailor) e configure o secret."
            exit 1
          fi

          api() {
            curl -sS --max-time 30 \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" "$@"
          }

          status="$(api "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.status // "DESCONHECIDO"')"
          echo "Status atual do projeto: $status"

          if [ "$status" = "ACTIVE_HEALTHY" ]; then
            echo "::error::Supabase esta ACTIVE_HEALTHY mas o endpoint falhou (HTTP $code). O problema NAO e pausa — investigar env vars (SUPABASE_SERVICE_ROLE), deploy ou Netlify. Nao vou chamar restore."
            exit 1
          fi

          echo "Disparando restore..."
          http="$(curl -sS -o /tmp/restore -w '%{http_code}' --max-time 30 -X POST \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H 'Content-Type: application/json' \
            "https://api.supabase.com/v1/projects/$PROJECT_REF/restore" -d '{}')"
          echo "restore -> HTTP $http"
          cat /tmp/restore 2>/dev/null; echo
          case "$http" in
            200|201|202|204) : ;;
            *) echo "::error::restore retornou HTTP $http"; exit 1 ;;
          esac

          echo "Aguardando o projeto voltar (ate ~10 min)..."
          for i in $(seq 1 30); do
            sleep 20
            s="$(api "https://api.supabase.com/v1/projects/$PROJECT_REF" | jq -r '.status // "DESCONHECIDO"')"
            echo "  [$i] status=$s"
            [ "$s" = "ACTIVE_HEALTHY" ] && break
          done

      - name: Reconferir o endpoint apos religar
        if: steps.ping.outputs.healthy == 'false'
        run: |
          set -uo pipefail
          sleep 20
          ok="false"
          for tentativa in 1 2 3 4 5; do
            tok="$(head -c 32 /dev/urandom | base64 | tr -dc 'A-Za-z0-9' | head -c 32)"
            code="$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 25 "$ENDPOINT/$tok" 2>/dev/null || echo "000")"
            echo "recheck $tentativa -> HTTP $code"
            if [ "$code" = "404" ] || [ "$code" = "200" ]; then ok="true"; break; fi
            sleep 20
          done
          if [ "$ok" != "true" ]; then
            echo "::error::Endpoint ainda nao respondeu saudavel apos o restore."
            exit 1
          fi
          echo "OK — endpoint saudavel de novo."
